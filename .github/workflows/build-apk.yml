name: Build Defectoscope AI 1.5.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'ci_152/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Restore complete 1.5.2 project
        shell: bash
        run: |
          set -euxo pipefail
          test "$(sha256sum ci_152/src_00.txt | awk '{print $1}')" = "552580d5fa8ce24d29f00e0a2fb3ecef7b98ea42de22ac524d445c84e550f268"
          test "$(sha256sum ci_152/src_01.txt | awk '{print $1}')" = "4f594c87b429943889a4377357c5e9fe1e27d6ab188bfe24ab50403938e0f5a5"
          test "$(sha256sum ci_152/seg_020.txt | awk '{print $1}')" = "3698560f28266442a9159cb9198807d7c8adc5b8836dc5fb518cd9720a14b3ea"
          test "$(sha256sum ci_152/seg_021.txt | awk '{print $1}')" = "aa56fb8a0ffa472be0bf9fd03bc6b0bb5d60f058754986a31959ce1658e344b4"
          test "$(sha256sum ci_152/seg_022.txt | awk '{print $1}')" = "d43245029d3865ac388a1a037d2d3b477ce1df5d41b845a3ec43a23b825f800c"
          test "$(sha256sum ci_152/src_03.txt | awk '{print $1}')" = "ba5a94269c306043919b849adf66dc01376ffe51ff0aadbb5c04be44b21a78b1"
          test "$(sha256sum ci_152/seg_040.txt | awk '{print $1}')" = "d53907981f0bea3a90f8b55c93fbf940c12929281ba1e5e617f4ff2719bc471a"
          test "$(sha256sum ci_152/seg_041.txt | awk '{print $1}')" = "1d683c8849717b32ad6fc2050e744c554f051cc40a991e95a4107cd7bc0e614a"
          test "$(sha256sum ci_152/seg_042.txt | awk '{print $1}')" = "e7fc062f5fc22ecfcc93d37ea49fee45a8ec5064b6812a864d73b9c835e059d4"
          test "$(sha256sum ci_152/seg_050.txt | awk '{print $1}')" = "985ff36ece8b8855854bbb2dbfc49855fbda5e0bd28840a1b4cc766796ba4535"
          test "$(sha256sum ci_152/seg_051.txt | awk '{print $1}')" = "aaf9418b0f35c4d8aa7d063426b0c519729c80b387d27bf7a748fb04995e05f0"
          test "$(sha256sum ci_152/seg_052.txt | awk '{print $1}')" = "d14428e45a9f6549186ecb154d4f4cfab1a7652b526725dc82f0bfe0aee2dfef"
          cat \
            ci_152/src_00.txt \
            ci_152/src_01.txt \
            ci_152/seg_020.txt \
            ci_152/seg_021.txt \
            ci_152/seg_022.txt \
            ci_152/src_03.txt \
            ci_152/seg_040.txt \
            ci_152/seg_041.txt \
            ci_152/seg_042.txt \
            ci_152/seg_050.txt \
            ci_152/seg_051.txt \
            ci_152/seg_052.txt > project.tar.xz.b64
          test "$(sha256sum project.tar.xz.b64 | awk '{print $1}')" = "91536ac31216447f8810f9ffe12d7654e14de588a393b21ef7482f185fdd3702"
          base64 --decode project.tar.xz.b64 > project.tar.xz
          test "$(sha256sum project.tar.xz | awk '{print $1}')" = "53b7295e65e984305fe738f106881d07cbaee64720a98525c31611cc0bd70fea"
          xz -t project.tar.xz
          mkdir -p project
          tar -xJf project.tar.xz -C project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/java/ru/defectdetector/transmission/ui/camera/CameraScreen.kt
          test -f project/app/src/main/java/ru/defectdetector/transmission/ui/screens/AboutScreen.kt
          test "$(find project/app/src/main/java -type f | wc -l)" -eq 42
          test "$(grep -c 'versionCode = 8' project/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionName = \"1.5.2\"' project/app/build.gradle.kts)" -eq 1
          grep -q 'by PCHOLko' project/app/src/main/java/ru/defectdetector/transmission/ui/screens/AboutScreen.kt
          grep -q '© 2026' project/app/src/main/java/ru/defectdetector/transmission/ui/screens/AboutScreen.kt
          rm -f project.tar.xz project.tar.xz.b64

      - name: Restore wheelset image and alert sounds
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p project/app/src/main/res/drawable project/app/src/main/res/raw
          base64 --decode ci_152/about_wheelset_micro.b64 > project/app/src/main/res/drawable/about_wheelset.webp
          test "$(sha256sum project/app/src/main/res/drawable/about_wheelset.webp | awk '{print $1}')" = "e74b55972d3507d95ea93cd45660741458f213581196505b4e61b9e9c92072be"
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          root = Path('project/app/src/main/res/raw')
          root.mkdir(parents=True, exist_ok=True)
          def tone(name, pattern):
              rate = 22050
              samples = []
              for freq, dur, amp in pattern:
                  count = int(rate * dur)
                  for index in range(count):
                      value = 0 if freq == 0 else int(32767 * amp * math.sin(2 * math.pi * freq * index / rate))
                      samples.append(value)
              with wave.open(str(root / name), 'wb') as output:
                  output.setnchannels(1)
                  output.setsampwidth(2)
                  output.setframerate(rate)
                  output.writeframes(b''.join(struct.pack('<h', value) for value in samples))
          tone('short_beep.wav', [(880, .14, .45)])
          tone('double_alarm.wav', [(1050, .13, .55), (0, .08, 0), (1050, .13, .55)])
          tone('sharp_alarm.wav', [(1350, .18, .65), (0, .06, 0), (1350, .18, .65)])
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Add build-only placeholder models
        shell: bash
        run: |
          mkdir -p project/app/src/main/assets/models
          printf 'PLACEHOLDER_MODEL_320' > project/app/src/main/assets/models/best_320.tflite
          printf 'PLACEHOLDER_MODEL_416' > project/app/src/main/assets/models/best_416.tflite
          printf 'PLACEHOLDER_MODEL_640' > project/app/src/main/assets/models/best_640.tflite

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defectoscope-1-5-2-gradle-build-log
          if-no-files-found: error
          path: gradle-build.log

      - name: Collect verification tools
        shell: bash
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" signing-tools/
          LIBCPP="$(find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so*' | head -n 1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" signing-tools/libc++.so
          chmod +x signing-tools/zipalign signing-tools/aapt signing-tools/aapt2

      - uses: actions/upload-artifact@v4
        with:
          name: defectoscope-1-5-2-shell-and-tools
          if-no-files-found: error
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
            signing-tools/aapt
            signing-tools/aapt2
            signing-tools/libc++.so
