name: Build Defectoscope AI 1.5.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'ci_full151/**'
      - 'ci_152/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Restore complete working project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p project
          cat ci_full151/full_151_*.txt > full_project.tar.xz.b64
          base64 --decode full_project.tar.xz.b64 > full_project.tar.xz
          xz -t full_project.tar.xz
          tar -xJf full_project.tar.xz -C project
          test -f project/settings.gradle.kts
          test -f project/app/src/main/java/ru/defectdetector/transmission/ui/camera/CameraScreen.kt
          test -f project/app/src/main/java/ru/defectdetector/transmission/ui/screens/AboutScreen.kt
          test "$(find project/app/src/main/java -type f | wc -l)" -eq 42
          rm -f full_project.tar.xz full_project.tar.xz.b64

      - name: Apply About screen and version 1.5.2
        shell: bash
        run: |
          set -euxo pipefail
          cp ci_152/AboutScreen.kt project/app/src/main/java/ru/defectdetector/transmission/ui/screens/AboutScreen.kt
          mkdir -p project/app/src/main/res/drawable
          base64 --decode ci_152/about_wheelset_micro.b64 > project/app/src/main/res/drawable/about_wheelset.webp
          test "$(sha256sum project/app/src/main/res/drawable/about_wheelset.webp | awk '{print $1}')" = "e74b55972d3507d95ea93cd45660741458f213581196505b4e61b9e9c92072be"
          sed -i 's/versionCode = 7/versionCode = 8/' project/app/build.gradle.kts
          sed -i 's/versionName = "1.5.1"/versionName = "1.5.2"/' project/app/build.gradle.kts
          grep -nE 'versionCode|versionName' project/app/build.gradle.kts
          test "$(grep -c 'versionCode = 8' project/app/build.gradle.kts)" -eq 1
          test "$(grep -c 'versionName = \"1.5.2\"' project/app/build.gradle.kts)" -eq 1
          grep -q 'by PCHOLko' project/app/src/main/java/ru/defectdetector/transmission/ui/screens/AboutScreen.kt
          grep -q '© 2026' project/app/src/main/java/ru/defectdetector/transmission/ui/screens/AboutScreen.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Add build-only placeholder models
        shell: bash
        run: |
          mkdir -p project/app/src/main/assets/models
          printf 'PLACEHOLDER_MODEL_320' > project/app/src/main/assets/models/best_320.tflite
          printf 'PLACEHOLDER_MODEL_416' > project/app/src/main/assets/models/best_416.tflite
          printf 'PLACEHOLDER_MODEL_640' > project/app/src/main/assets/models/best_640.tflite

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defectoscope-1-5-2-gradle-build-log
          if-no-files-found: error
          path: gradle-build.log

      - name: Collect verification tools
        shell: bash
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" signing-tools/
          LIBCPP="$(find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so*' | head -n 1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" signing-tools/libc++.so
          chmod +x signing-tools/zipalign signing-tools/aapt signing-tools/aapt2

      - uses: actions/upload-artifact@v4
        with:
          name: defectoscope-1-5-2-shell-and-tools
          if-no-files-found: error
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
            signing-tools/aapt
            signing-tools/aapt2
            signing-tools/libc++.so
