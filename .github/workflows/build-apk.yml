name: Build Defectoscope AI Camera Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-defectoscope-camera-offline-1.4.0
    paths:
      - '.github/workflows/build-apk.yml'
      - 'ci_overlay/**'
      - 'ci_diag/**'
      - 'ci_coordinate_parts/**'
      - 'ci_14/**'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Restore Android project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p project
          cat ci_tgz/tgz_*.txt > project.b64
          python3 - <<'PY'
          from pathlib import Path
          path = Path('project.b64')
          chars = list(path.read_text())
          repairs = {13952: 'i', 16176: 'i', 16599: 'i', 21231: 'U'}
          for index, value in repairs.items():
              chars[index] = value
          path.write_text(''.join(chars))
          PY
          test "$(sha256sum project.b64 | awk '{print $1}')" = "9993d22053c36b8d98809e1b89766bccbc9d309a88842cbf82813cbafd77b575"
          base64 --decode project.b64 > project.tar.gz
          test "$(sha256sum project.tar.gz | awk '{print $1}')" = "ddd425eecef50e043344dc8bb4d1ade3b5607cf653875237db16a61423534a37"
          gzip -t project.tar.gz
          tar -xzf project.tar.gz -C project
          test -f project/settings.gradle.kts
          rm -f project.tar.gz project.b64

      - name: Apply source overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci_overlay/overlay_*.txt > overlay.b64
          test "$(sha256sum overlay.b64 | awk '{print $1}')" = "df4ad818237af6bd85ca53fc923c602d783d36978c4561ee7b63e89511d25bf5"
          base64 --decode overlay.b64 > overlay.tar.gz
          test "$(sha256sum overlay.tar.gz | awk '{print $1}')" = "74634457ce804113713575b6912141de48016b9c1b0e96dd880b4930b1103aaf"
          gzip -t overlay.tar.gz
          tar -xzf overlay.tar.gz -C project
          rm -f overlay.tar.gz overlay.b64

      - name: Apply diagnostics overlay
        shell: bash
        run: |
          set -euxo pipefail
          cat ci_diag/diag_*.txt > diagnostics.b64
          test "$(sha256sum diagnostics.b64 | awk '{print $1}')" = "f6c80a47fec6dbbcb18b876d492560c345891960919cc5ce2839a321cff6de13"
          base64 --decode diagnostics.b64 > diagnostics.tar.gz
          test "$(sha256sum diagnostics.tar.gz | awk '{print $1}')" = "fb06cdbbdaf1c64e226e5b823ee1b527d2e44747b310c4d17bf1563c9d701e15"
          gzip -t diagnostics.tar.gz
          tar -xzf diagnostics.tar.gz -C project
          rm -f diagnostics.tar.gz diagnostics.b64

      - name: Apply coordinate conversion fix
        shell: bash
        run: |
          set -euxo pipefail
          cat ci_coordinate_parts/part_*.txt | tr -d '\r\n' > coordinate_fix.b64
          test "$(sha256sum coordinate_fix.b64 | awk '{print $1}')" = "1e891a48f0a28460de34784674f964095d6d3c5e1ba451c5886ada203051116d"
          base64 --decode coordinate_fix.b64 > coordinate_fix.tar.gz
          test "$(sha256sum coordinate_fix.tar.gz | awk '{print $1}')" = "1eeca3583606a51aaacb98d98b98ad01053328332432569a72ac8abe3597ddd8"
          gzip -t coordinate_fix.tar.gz
          tar -xzf coordinate_fix.tar.gz -C project
          rm -f coordinate_fix.tar.gz coordinate_fix.b64

      - name: Apply camera and offline update
        shell: bash
        run: |
          set -euxo pipefail
          cat ci_14/patch_*.txt > update_140.patch
          test "$(sha256sum update_140.patch | awk '{print $1}')" = "94e9425d86b2698a44430d71f6ee8ee65692023156a7aa2878e7460c61a0b8d9"
          patch -p2 -d project < update_140.patch
          rm -f update_140.patch
          grep -n 'versionCode\|versionName\|litert' project/app/build.gradle.kts
          test -f project/app/src/main/java/ru/defectdetector/transmission/ui/offline/OfflineAnalysisScreen.kt
          test -f project/app/src/main/java/ru/defectdetector/transmission/camera/UsbEndoscopeSupport.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create build-only placeholder assets
        shell: bash
        run: |
          mkdir -p project/app/src/main/assets/models project/app/src/main/res/raw
          printf 'PLACEHOLDER_MODEL_320' > project/app/src/main/assets/models/best_320.tflite
          printf 'PLACEHOLDER_MODEL_416' > project/app/src/main/assets/models/best_416.tflite
          printf 'PLACEHOLDER_MODEL_640' > project/app/src/main/assets/models/best_640.tflite
          python3 - <<'PY'
          import math, struct, wave
          from pathlib import Path
          root = Path('project/app/src/main/res/raw')
          root.mkdir(parents=True, exist_ok=True)
          def tone(name, pattern):
              rate = 22050
              samples=[]
              for freq,dur,amp in pattern:
                  n=int(rate*dur)
                  for i in range(n):
                      v=0 if freq==0 else int(32767*amp*math.sin(2*math.pi*freq*i/rate))
                      samples.append(v)
              with wave.open(str(root/name),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
                  w.writeframes(b''.join(struct.pack('<h',x) for x in samples))
          tone('short_beep.wav', [(880,.14,.45)])
          tone('double_alarm.wav', [(1050,.13,.55),(0,.08,0),(1050,.13,.55)])
          tone('sharp_alarm.wav', [(1350,.18,.65),(0,.06,0),(1350,.18,.65)])
          PY

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-offline-gradle-build-log
          if-no-files-found: warn
          path: gradle-build.log

      - name: Collect APK inspection tools
        if: success()
        shell: bash
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/aapt2" signing-tools/
          LIBCPP="$(find "$ANDROID_HOME/build-tools/35.0.0" -name 'libc++.so*' | head -n 1)"
          test -n "$LIBCPP"
          cp "$LIBCPP" signing-tools/libc++.so
          chmod +x signing-tools/zipalign signing-tools/aapt2

      - name: Upload APK shell and tools
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: defectoscope-ai-1.4.0-shell-and-tools
          if-no-files-found: error
          path: |
            project/app/build/outputs/apk/debug/app-debug.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
            signing-tools/aapt2
            signing-tools/libc++.so
