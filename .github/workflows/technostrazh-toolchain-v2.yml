name: Technostrazh Android offline toolchain v2

on:
  push:
    branches: [ technostrazh-build-tools ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'

      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create dependency probe project
        shell: bash
        run: |
          set -euo pipefail
          PROBE="$RUNNER_TEMP/probe"
          mkdir -p "$PROBE/app/src/main/java/probe/toolchain"
          mkdir -p "$PROBE/app/src/main/res/values"

          cat > "$PROBE/settings.gradle.kts" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TechnostrazhDependencyProbe"
          include(":app")
          EOF

          cat > "$PROBE/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
              id("com.google.devtools.ksp") version "2.1.20-1.0.32" apply false
          }
          EOF

          cat > "$PROBE/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          android.nonFinalResIds=false
          EOF

          cat > "$PROBE/app/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }

          android {
              namespace = "probe.toolchain"
              compileSdk = 36
              defaultConfig {
                  applicationId = "probe.toolchain"
                  minSdk = 26
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures {
                  compose = true
                  buildConfig = true
              }
              packaging {
                  resources.excludes += setOf(
                      "/META-INF/{AL2.0,LGPL2.1}",
                      "META-INF/DEPENDENCIES",
                      "META-INF/LICENSE*",
                      "META-INF/NOTICE*"
                  )
              }
              androidResources { noCompress += listOf("tflite") }
          }

          ksp { arg("room.schemaLocation", "$projectDir/schemas") }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)

              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.4")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
              implementation("androidx.navigation:navigation-compose:2.9.5")

              val cameraX = "1.6.1"
              implementation("androidx.camera:camera-core:$cameraX")
              implementation("androidx.camera:camera-camera2:$cameraX")
              implementation("androidx.camera:camera-lifecycle:$cameraX")
              implementation("androidx.camera:camera-view:$cameraX")
              implementation("androidx.concurrent:concurrent-futures-ktx:1.3.0")
              implementation("org.uvccamera:lib:0.0.13")
              implementation("androidx.datastore:datastore-preferences:1.2.1")

              val room = "2.8.4"
              implementation("androidx.room:room-runtime:$room")
              implementation("androidx.room:room-ktx:$room")
              ksp("androidx.room:room-compiler:$room")

              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("com.google.ai.edge.litert:litert:1.4.2")
              implementation("com.google.ai.edge.litert:litert-gpu:1.4.2")
              implementation("com.google.ai.edge.litert:litert-gpu-api:1.4.2")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
          }
          EOF

          cat > "$PROBE/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$PROBE/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat > "$PROBE/app/src/main/java/probe/toolchain/MainActivity.kt" <<'EOF'
          package probe.toolchain

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.room.Database
          import androidx.room.Entity
          import androidx.room.PrimaryKey
          import androidx.room.RoomDatabase

          @Entity
          data class ProbeEntity(@PrimaryKey val id: Int)

          @Database(entities = [ProbeEntity::class], version = 1, exportSchema = true)
          abstract class ProbeDatabase : RoomDatabase()

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { ProbeScreen() }
              }
          }

          @Composable
          private fun ProbeScreen() {
              Text("TECHNOSTRAZH dependency probe")
          }
          EOF

      - name: Resolve and compile complete dependency graph
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/technostrazh-gradle-home
        run: |
          set -euo pipefail
          gradle -p "$RUNNER_TEMP/probe" --no-daemon --stacktrace clean assembleDebug

      - name: Package reusable offline toolchain
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/technostrazh-gradle-home
        run: |
          set -euo pipefail
          BUNDLE="$RUNNER_TEMP/toolchain-bundle"
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME_REAL="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"

          mkdir -p "$BUNDLE/gradle" "$BUNDLE/jdk"
          mkdir -p "$BUNDLE/android-sdk/platforms" "$BUNDLE/android-sdk/build-tools"
          mkdir -p "$BUNDLE/gradle-user-home"

          cp -a "$GRADLE_HOME_REAL/." "$BUNDLE/gradle/"
          cp -a "$JAVA_HOME/." "$BUNDLE/jdk/"
          cp -a "$ANDROID_HOME/platforms/android-36" "$BUNDLE/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$BUNDLE/android-sdk/build-tools/"
          cp -a "$ANDROID_HOME/platform-tools" "$BUNDLE/android-sdk/"
          cp -a "$ANDROID_HOME/licenses" "$BUNDLE/android-sdk/"
          cp -a "$GRADLE_USER_HOME/caches" "$BUNDLE/gradle-user-home/"

          find "$BUNDLE/gradle-user-home/caches" -type f \
            \( -name '*.lock' -o -name 'gc.properties' \) -delete || true
          rm -rf "$BUNDLE/gradle-user-home/caches/build-cache-"* || true

          mkdir -p artifact
          cat > "$BUNDLE/TOOLCHAIN_INFO.txt" <<EOF
          Gradle=8.11.1
          Java=17
          AndroidPlatform=36
          AndroidBuildTools=35.0.0
          GeneratedUTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          tar --zstd -cf artifact/technostrazh-android-offline-toolchain.tar.zst \
            -C "$BUNDLE" .
          sha256sum artifact/technostrazh-android-offline-toolchain.tar.zst \
            > artifact/technostrazh-android-offline-toolchain.tar.zst.sha256
          ls -lh artifact
          du -sh "$BUNDLE" artifact/technostrazh-android-offline-toolchain.tar.zst

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: technostrazh-android-offline-toolchain-v2
          path: artifact/
          compression-level: 0
          retention-days: 1
