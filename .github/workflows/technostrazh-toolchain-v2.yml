name: Technostrazh toolchain cache v2

on:
  push:
    branches: [ technostrazh-toolchain ]
    paths:
      - '.github/workflows/technostrazh-toolchain-v2.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Download Gradle 8.11.1
        shell: bash
        run: |
          mkdir -p /tmp/tz-toolchain
          curl -fL --retry 5 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp/tz-toolchain
      - name: Warm exact dependencies
        shell: bash
        run: |
          mkdir -p /tmp/warm/app/src/main/java/example
          printf 'android.useAndroidX=true\nkotlin.code.style=official\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' > /tmp/warm/gradle.properties
          cat > /tmp/warm/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Warm"
          include(":app")
          EOF
          cat > /tmp/warm/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
              id("com.google.devtools.ksp") version "2.1.20-1.0.32" apply false
          }
          EOF
          cat > /tmp/warm/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "example"
              compileSdk = 36
              defaultConfig { applicationId = "example.warm"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.9.4")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
              implementation("androidx.navigation:navigation-compose:2.9.5")
              val cameraX = "1.6.1"
              implementation("androidx.camera:camera-core:$cameraX")
              implementation("androidx.camera:camera-camera2:$cameraX")
              implementation("androidx.camera:camera-lifecycle:$cameraX")
              implementation("androidx.camera:camera-view:$cameraX")
              implementation("androidx.concurrent:concurrent-futures-ktx:1.3.0")
              implementation("androidx.datastore:datastore-preferences:1.2.1")
              val room = "2.8.4"
              implementation("androidx.room:room-runtime:$room")
              implementation("androidx.room:room-ktx:$room")
              ksp("androidx.room:room-compiler:$room")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
              implementation("com.google.ai.edge.litert:litert:1.4.2")
              implementation("com.google.ai.edge.litert:litert-gpu:1.4.2")
              implementation("com.google.ai.edge.litert:litert-gpu-api:1.4.2")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
          }
          EOF
          cat > /tmp/warm/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>
          EOF
          printf 'package example\nclass Warm\n' > /tmp/warm/app/src/main/java/example/Warm.kt
          cd /tmp/warm
          /tmp/tz-toolchain/gradle-8.11.1/bin/gradle --no-daemon assembleDebug
      - name: Pack and split reusable offline toolchain
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/export/android-sdk/platforms /tmp/export/android-sdk/build-tools /tmp/export/android-sdk/platform-tools /tmp/export/gradle /tmp/export/gradle-home /tmp/export/jdk /tmp/chunks
          cp -a "$ANDROID_SDK_ROOT/platforms/android-36" /tmp/export/android-sdk/platforms/
          cp -a "$ANDROID_SDK_ROOT/build-tools/36.0.0" /tmp/export/android-sdk/build-tools/
          cp -a "$ANDROID_SDK_ROOT/platform-tools"/. /tmp/export/android-sdk/platform-tools/
          cp -a /tmp/tz-toolchain/gradle-8.11.1 /tmp/export/gradle/
          cp -a "$HOME/.gradle/caches" /tmp/export/gradle-home/
          cp -a "$JAVA_HOME"/. /tmp/export/jdk/
          tar -I 'zstd -8 -T0' -cf /tmp/technostrazh-toolchain.tar.zst -C /tmp/export .
          sha256sum /tmp/technostrazh-toolchain.tar.zst > /tmp/technostrazh-toolchain.sha256
          split -b 330M -d -a 2 /tmp/technostrazh-toolchain.tar.zst /tmp/chunks/toolchain.part-
          cp /tmp/technostrazh-toolchain.sha256 /tmp/chunks/
          ls -lh /tmp/chunks
      - name: Upload toolchain part 00
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technostrazh-toolchain-part-00
          path: /tmp/chunks/toolchain.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload toolchain part 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technostrazh-toolchain-part-01
          path: /tmp/chunks/toolchain.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload toolchain part 02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technostrazh-toolchain-part-02
          path: |
            /tmp/chunks/toolchain.part-02
            /tmp/chunks/technostrazh-toolchain.sha256
          compression-level: 0
          retention-days: 1
